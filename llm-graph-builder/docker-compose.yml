version: "3"

services:
  backend:
    build:
      context: ./llm-graph-builder/backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./llm-graph-builder/backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j
    networks:
      - net

  frontend:
    build:
      context: ./llm-graph-builder/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - net

networks:
  net:
    external: true
    name: part1-neo4j_net